<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gocheski Mind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-page">
    <main class="popup-card">
      <div class="brand-row">
        <img src="icons/icon-48.png" alt="" />
        <div>
          <strong>Mind</strong>
          <span data-status>Checking connection…</span>
        </div>
      </div>
      <p>Right-click a page, link, selection, or image and choose <strong>Save to Mind</strong>.</p>
      <div class="button-row">
        <button class="primary" type="button" data-open-mind>Open Mind</button>
        <button type="button" data-open-settings>Settings</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
